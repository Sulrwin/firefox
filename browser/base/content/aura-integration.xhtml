<?xml version="1.0"?>
<!--
  Aura Integration - Included in browser.xhtml
  This file loads the Aura bubble tab UI and connects it to Firefox's tabbrowser
-->
<script src="chrome://browser/content/aura/bubble-tabs.js" />

<div id="aura-ui-root"></div>

<script>
<![CDATA[
(function() {
  const AURA_ENABLED = true;
  
  if (!AURA_ENABLED) return;
  
  function initAuraBridge() {
    if (window.auraBridgeInitialized) return;
    window.auraBridgeInitialized = true;
    
    console.log('[Aura] Initializing Aura bridge...');
    
    // Wait for gBrowser to be available
    if (!window.gBrowser) {
      setTimeout(initAuraBridge, 100);
      return;
    }
    
    // Initialize AuraBubbleTabs
    const auraRoot = document.getElementById('aura-ui-root');
    if (!auraRoot || typeof AuraBubbleTabs === 'undefined') {
      console.error('[Aura] Failed to initialize: missing root or class');
      return;
    }
    
    const auraUI = new AuraBubbleTabs({
      onTabSelect: (tabId) => {
        const index = parseInt(tabId.replace('tab-', ''));
        if (gBrowser.tabs[index]) {
          gBrowser.selectTabAtIndex(index);
        }
      },
      onTabClose: (tabId) => {
        const index = parseInt(tabId.replace('tab-', ''));
        const tab = gBrowser.tabs[index];
        if (tab) {
          gBrowser.removeTab(tab);
        }
      },
      onNewTab: (url) => {
        openNewTabWith(url || 'about:newtab');
      },
      onTabPin: (tabId, pinned) => {
        const index = parseInt(tabId.replace('tab-', ''));
        const tab = gBrowser.tabs[index];
        if (tab) {
          if (pinned) {
            gBrowser.pinTab(tab);
          } else {
            gBrowser.unpinTab(tab);
          }
        }
      },
      onBack: () => {
        if (window.history.length > 1) {
          window.history.back();
        }
      },
      onForward: () => {
        window.history.forward();
      },
      onRefresh: () => {
        BrowserReload();
      },
      onExtensions: () => {
        const btn = document.getElementById('unified-extensions-button');
        if (btn) btn.click();
      },
      onSettings: () => {
        openPreferences();
      }
    });
    
    // Sync initial tabs
    function syncTabs() {
      const tabs = [];
      for (let i = 0; i < gBrowser.tabs.length; i++) {
        const browser = gBrowser.tabs[i];
        tabs.push({
          id: `tab-${i}`,
          title: browser.label || 'New Tab',
          url: browser.currentURI?.spec || '',
          favicon: browser.image || null,
          pinned: browser.pinned || false,
          loading: browser.getAttribute('busy') === 'true',
          active: browser.selected
        });
      }
      auraUI.setTabs(tabs);
    }
    
    // Initial sync
    syncTabs();
    
    // Bind gBrowser events
    gBrowser.addEventListener('TabOpen', syncTabs);
    gBrowser.addEventListener('TabClose', syncTabs);
    gBrowser.addEventListener('TabSelect', syncTabs);
    gBrowser.addEventListener('TabPinned', syncTabs);
    gBrowser.addEventListener('TabUnpinned', syncTabs);
    
    // Hide native tabbar
    const tabsToolbar = document.getElementById('TabsToolbar');
    if (tabsToolbar) {
      tabsToolbar.style.display = 'none';
    }
    
    // Hide nav bar elements we replace
    const backButton = document.getElementById('back-button');
    const forwardButton = document.getElementById('forward-button');
    if (backButton) backButton.style.display = 'none';
    if (forwardButton) forwardButton.style.display = 'none';
    
    console.log('[Aura] Bridge initialized successfully');
  }
  
  // Initialize after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAuraBridge);
  } else {
    initAuraBridge();
  }
})();
]]>
</script>
