<!-- Bubble Tab UI - HTML Template -->

<div id="aura-ui-root">
  <!-- Collapsed State: Oval Trigger -->
  <button class="aura-trigger" id="aura-trigger" aria-label="Open tabs">
    <span class="aura-trigger-icon">+</span>
  </button>

  <!-- Expanded State: Bubble Container -->
  <div class="aura-bubble-container" id="aura-bubbles">
    
    <!-- Pinned Tabs Group -->
    <div class="aura-pinned-group" id="aura-pinned">
      <!-- Pinned bubbles rendered here -->
    </div>

    <!-- Active Tabs Group -->
    <div class="aura-tab-group" id="aura-tabs">
      <!-- Tab bubbles rendered here -->
    </div>

    <!-- Add New Tab Bubble -->
    <button class="aura-bubble aura-bubble-add" id="aura-add-tab" aria-label="New tab"></button>
  </div>
</div>
